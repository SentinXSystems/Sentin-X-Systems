<!DOCTYPE html>
<html lang="nl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | SentinX Systems</title>

    <style>

        :root {
            --bg: #06111f;
            --card: rgba(12, 31, 50, 0.92);
            --cyan: #00d9ff;
            --text: #f3f8ff;
            --muted: #a9bacb;
            --border: rgba(0, 217, 255, 0.22);
            --green: #42e695;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(3, 12, 23, 0.82),
                    rgba(3, 12, 23, 0.94)
                ),
                url("security-background.jpg")
                center/cover fixed;

            color: var(--text);

            min-height: 100vh;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(0, 217, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            z-index: -1;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        .container {

            width: min(1150px, 92%);

            margin: auto;
        }


        /* NAV */

        nav {

            position: sticky;

            top: 0;

            z-index: 100;

            background: rgba(4, 14, 27, 0.92);

            backdrop-filter: blur(14px);

            border-bottom: 1px solid var(--border);
        }


        .nav-inner {

            min-height: 78px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            height: 48px;

            width: auto;
        }


        .back {

            color: var(--cyan);

            font-weight: bold;
        }


        /* PRODUCT */

        main {

            padding: 80px 0;
        }


        .product-detail {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 50px;

            align-items: center;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 35px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);
        }


        .product-image-box {

            overflow: hidden;

            border-radius: 18px;

            border: 1px solid var(--border);

            background: #081827;
        }


        .product-image {

            width: 100%;

            height: 480px;

            object-fit: cover;

            display: block;
        }


        .category {

            color: var(--cyan);

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 12px;
        }


        h1 {

            font-size: clamp(38px, 5vw, 62px);

            line-height: 1.05;

            margin-bottom: 20px;
        }


        .price {

            font-size: 34px;

            font-weight: bold;

            color: var(--cyan);

            margin-bottom: 22px;
        }


        .description {

            color: var(--muted);

            font-size: 17px;

            margin-bottom: 28px;
        }


        .features {

            list-style: none;

            margin-bottom: 30px;
        }


        .features li {

            margin-bottom: 12px;

            color: #d9e8f5;
        }


        .features li::before {

            content: "✓";

            color: var(--green);

            font-weight: bold;

            margin-right: 10px;
        }


        .buttons {

            display: flex;

            gap: 14px;

            flex-wrap: wrap;
        }


        .btn {

            display: inline-block;

            padding: 14px 22px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.2s;
        }


        .order-btn {

            background: var(--cyan);

            color: #03111d;
        }


        .order-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(0,217,255,0.35);
        }


        .back-btn {

            border: 1px solid var(--border);

            background: rgba(255,255,255,0.04);
        }


        .back-btn:hover {

            border-color: var(--cyan);
        }


        .error {

            max-width: 700px;

            margin: 100px auto;

            padding: 40px;

            text-align: center;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;
        }


        .error h1 {

            font-size: 40px;

            margin-bottom: 15px;
        }


        .error p {

            color: var(--muted);

            margin-bottom: 25px;
        }


        footer {

            border-top: 1px solid var(--border);

            padding: 30px 0;

            color: var(--muted);

            text-align: center;
        }


        @media (max-width: 800px) {

            .product-detail {

                grid-template-columns: 1fr;

                padding: 20px;
            }


            .product-image {

                height: 330px;
            }


            main {

                padding: 40px 0;
            }

        }

    </style>

</head>
